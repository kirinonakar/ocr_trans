[package]
name = "ocr_trans"
version = "0.1.0"
edition = "2021"

[dependencies]
# Keep the Slint runtime, backend, and compiler on the same 1.17 release.
slint = { version = "=1.17.1", features = ["renderer-skia"] }
pulldown-cmark = "0.13.5"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
httpdate = "1.0.3"
uuid = { version = "1.29.0", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = "0.25.10"
fast_image_resize = "6.1.0"
xcap = "0.9.8"
global-hotkey = "0.9.0"
base64 = "0.23.1"
arboard = "3.7.0"
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture"
] }
# WinRT async types moved out of windows; match windows 0.62's ABI dependency.
windows-future = "0.3.2"
i-slint-backend-winit = "=1.17.1"
winit = "0.30.13"

[build-dependencies]
slint-build = "=1.17.1"
winres = "0.1.12"

[profile.release]
opt-level = "z"      # 크기 최적화 (s 또는 z)
lto = true           # Link Time Optimization: 미사용 코드 제거
codegen-units = 1    # 병렬 컴파일을 제한하여 최적화 기회 극대화
panic = "abort"      # 패닉 발생 시 스택 추적 정보 제거
strip = true         # 심볼 정보 및 디버그 정보 강제 제거

# Keep pixel preprocessing fast in the size-optimized application.
[profile.release.package.image]
opt-level = 3

[profile.release.package.fast_image_resize]
opt-level = 3
