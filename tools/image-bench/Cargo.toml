[package]
name = "ocr-image-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[profile.image-speed]
inherits = "release"

[profile.image-speed.package.image]
opt-level = 3
